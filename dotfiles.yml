---
- name: Bootstrap development environment
  hosts: local
  vars_files:
    - versions.yml
  pre_tasks:
    - name: Keep sudo alive
      become: true
      command: /usr/bin/true
      changed_when: false

  tasks:
    # MacOS Specific Roles
    - name: OS X Command Line Tools
      include_role: name=elliotweiser.osx-command-line-tools
      when: ansible_os_family == 'Darwin'
      tags: [osx-tools]

    - name: Homebrew
      include_role: name=brew
      when: ansible_os_family == 'Darwin'
      tags: [brew]

    - name: Alacritty
      import_role: name=alacritty
      tags: [alacritty]

    # Common Roles
    - name: Git
      import_role: name=git
      tags: [git]

    - name: Zsh
      import_role: name=zsh
      tags: [zsh]

    - name: Direnv
      import_role: name=direnv
      tags: [direnv]

    - name: Fzf
      import_role: name=fzf
      tags: [fzf]

    - name: Ripgrep
      import_role: name=ripgrep
      tags: [ripgrep]

    - name: Neovim
      import_role: name=nvim
      tags: [nvim]

    - name: Tmux
      import_role: name=tmux
      tags: [tmux]

    - name: Golang
      import_role: name=golang
      tags: [golang]

    - name: Python
      import_role: name=python
      tags: [python]

    - name: Redis
      import_role: name=redis
      tags: [redis]

    - name: Docker
      import_role: name=docker
      tags: [docker]

    - name: Ranger
      import_role: name=ranger
      tags: [ranger]

    - name: Node
      import_role: name=node
      tags: [node]

    - name: EFM Langserver
      import_role: name=efm-langserver
      tags: [efm-langserver]

    - name: StyLua
      import_role: name=stylua
      tags: [stylua]

    - name: VS Code
      import_role: name=gantsign.visual-studio-code
      vars:
        users:
          - username: "{{ dotfiles_user }}"
            visual_studio_code_extensions:
              - "eamodio.gitlens"
              - "kahole.magit"
              - "PhilHindle.errorlens"
              - "sleistner.vscode-fileutils"
              - "vscodevim.vim"
              - "EditorConfig.EditorConfig"
      tags: [vscode]

    - name: Desktop
      import_role: name=desktop
      tags: [desktop]

    - name: AWS
      import_role: name=aws
      tags: [aws]

    - name: Postman
      import_role: name=postman
      tags: [postman]

    - name: Ollama
      import_role: name=ollama
      tags: [ollama]

    - name: Claude
      import_role: name=claude
      tags: [claude]

    - name: Gemini
      import_role: name=gemini
      tags: [gemini]

    - name: OpenAI
      import_role: name=openai
      tags: [openai]

    - name: Obsidian
      import_role: name=obsidian
      tags: [obsidian]

    - name: Wisperflow
      import_role: name=wisperflow
      tags: [wisperflow]

    - name: Antigravity
      import_role: name=antigravity
      tags: [antigravity]

    - name: Ast-grep
      import_role: name=ast-grep
      tags: [ast-grep]
