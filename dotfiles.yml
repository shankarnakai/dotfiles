---
- name: Bootstrap development environment
  hosts: local
  pre_tasks:
    - name: Keep sudo alive
      become: true
      command: /usr/bin/true
      changed_when: false

  tasks:
    # MacOS Specific Roles
    - name: OS X Command Line Tools
      include_role: name=elliotweiser.osx-command-line-tools
      when: ansible_os_family == 'Darwin'
      tags: [osx-tools]

    - name: Homebrew
      include_role: name=brew
      when: ansible_os_family == 'Darwin'
      tags: [brew]

    - name: Alacritty
      include_role: name=alacritty
      when: ansible_os_family == 'Darwin'
      tags: [alacritty]

    # Common Roles
    - name: Git
      include_role: name=git
      tags: [git]

    - name: Zsh
      include_role: name=zsh
      tags: [zsh]

    - name: Direnv
      include_role: name=direnv
      tags: [direnv]

    - name: Fzf
      include_role: name=fzf
      tags: [fzf]

    - name: Ripgrep
      include_role: name=ripgrep
      tags: [ripgrep]

    - name: Neovim
      include_role: name=nvim
      tags: [nvim]

    - name: Tmux
      include_role: name=tmux
      tags: [tmux]

    - name: Golang
      include_role: name=golang
      tags: [golang]

    - name: Python
      include_role: name=python
      tags: [python]

    - name: Redis
      include_role: name=redis
      tags: [redis]

    - name: Ranger
      include_role: name=ranger
      tags: [ranger]

    - name: Node
      include_role: name=node
      tags: [node]

    - name: EFM Langserver
      include_role: name=efm-langserver
      vars:
        efm_langserver_version: "0.0.44"
      tags: [efm-langserver]

    - name: VS Code
      include_role: name=gantsign.visual-studio-code
      vars:
        users:
          - username: "{{ dotfiles_user }}"
            visual_studio_code_extensions:
              - "eamodio.gitlens"
              - "kahole.magit"
              - "PhilHindle.errorlens"
              - "sleistner.vscode-fileutils"
              - "vscodevim.vim"
              - "EditorConfig.EditorConfig"
      tags: [vscode]

    - name: Desktop
      include_role: name=desktop
      tags: [desktop]

    - name: AWS
      include_role: name=aws
      tags: [aws]

    - name: Postman
      include_role: name=postman
      tags: [postman]

    - name: Ollama
      include_role: name=ollama
      tags: [ollama]

    - name: Claude
      include_role: name=claude
      tags: [claude]

    - name: Gemini
      include_role: name=gemini
      tags: [gemini]

    - name: OpenAI
      include_role: name=openai
      tags: [openai]

    - name: Obsidian
      include_role: name=obsidian
      tags: [obsidian]

    - name: Wisperflow
      include_role: name=wisperflow
      tags: [wisperflow]

    - name: Antigravity
      include_role: name=antigravity
      tags: [antigravity]

    - name: Ast-grep
      include_role: name=ast-grep
      tags: [ast-grep]
