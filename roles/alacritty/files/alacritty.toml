[env]
TERM = "xterm-256color"

[font]
size = 12

[font.bold]
family = "Monoid"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "Monoid"

[font.normal]
family = "Monoid"

[font.offset]
x = 0
y = 0

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Command"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Command"

[[keyboard.bindings]]
action = "Quit"
key = "Q"
mods = "Command"

[[keyboard.bindings]]
action = "Quit"
key = "W"
mods = "Command"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "N"
mods = "Command"

[[keyboard.bindings]]
