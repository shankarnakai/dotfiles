[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[window]
decorations = "buttonless"
opacity = 0.98
option_as_alt = 'Both'

[window.dimensions]
columns = 510
lines = 100

[window.padding]
x = 0
y = 0

[general]
import = [
    "~/.config/alacritty/catppuccin-macchiato.toml"
]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b\r"

