---
- name: Fetch latest Go release info from go.dev
  uri:
    url: https://go.dev/dl/?mode=json
    return_content: true
  register: go_releases
  delegate_to: localhost
  tags: [golang, updates]

- name: Set latest Go version variable
  set_fact:
    golang_latest_version: "{{ (go_releases.json | selectattr('stable', 'equalto', true) | first).version }}"
  tags: [golang, updates]

- name: Compare versions
  debug:
    msg: "golang: current={{ golang_version | default('none') }}, latest={{ golang_latest_version }}"
  tags: [golang, updates]
