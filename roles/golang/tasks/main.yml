---
- name: Set Go OS and architecture
  set_fact:
    go_os: "{{ 'darwin' if ansible_os_family == 'Darwin' else 'linux' }}"
    go_arch: "{{ 'arm64' if ansible_architecture == 'arm64' or ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Check installed Go version
  shell: /usr/local/go/bin/go version 2>/dev/null | awk '{print $3}' || echo "none"
  register: go_current
  changed_when: false
  failed_when: false

- name: Install tar (Linux)
  package:
    name: tar
    state: present
  become: true
  when: ansible_os_family == "Debian"

- name: Remove old Go installation
  file:
    path: /usr/local/go
    state: absent
  become: true
  when: go_current.stdout != golang_version

- name: Download and extract Go
  unarchive:
    src: "https://dl.google.com/go/{{ golang_version }}.{{ go_os }}-{{ go_arch }}.tar.gz"
    dest: "/usr/local"
    remote_src: true
  become: true
  when: go_current.stdout != golang_version


