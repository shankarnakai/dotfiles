---
- name: Fetch latest stable Go release info
  uri:
    url: https://go.dev/dl/?mode=json
    return_content: true
  register: go_releases

- name: Set latest Go version
  set_fact:
    go_version: "{{ (go_releases.json | selectattr('stable', 'equalto', true) | first).version }}"

- name: Set Go OS and architecture
  set_fact:
    go_os: "{{ 'darwin' if ansible_os_family == 'Darwin' else 'linux' }}"
    go_arch: "{{ 'arm64' if ansible_architecture == 'arm64' or ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Check installed Go version
  shell: /usr/local/go/bin/go version 2>/dev/null | awk '{print $3}' || echo "none"
  register: go_current
  changed_when: false
  failed_when: false

- name: Install tar (Linux)
  package:
    name: tar
    state: present
  become: true
  when: ansible_os_family == "Debian"

- name: Download and extract Go
  unarchive:
    src: "https://dl.google.com/go/{{ go_version }}.{{ go_os }}-{{ go_arch }}.tar.gz"
    dest: "/usr/local"
    remote_src: true
  become: true
  when: go_current.stdout != go_version
