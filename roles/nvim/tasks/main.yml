---
# Installation
- import_tasks: mac.yml
  when: ansible_os_family == "Darwin"

# Neovim config - symlink the Lua-based config directory
- name: Remove old ~/.config/nvim if it is a plain directory (not a symlink)
  file:
    path: "{{ dotfiles_user_home }}/.config/nvim"
    state: absent
  when: >
    ansible_local is defined or True
  # Only removes if it's a directory; symlinks are handled by the next task
  failed_when: False

- name: Ensure ~/.config directory exists
  file:
    path: "{{ dotfiles_user_home }}/.config"
    state: directory
    mode: "0755"

- name: Symlink nvim config directory to dotfiles
  file:
    src: "{{ dotfiles_home }}/roles/nvim/files/nvim"
    dest: "{{ dotfiles_user_home }}/.config/nvim"
    state: link
    force: yes
