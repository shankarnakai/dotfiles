---
- name: Get latest stable Python 3 version from pyenv
  shell: |
    export PATH="{{ ansible_env.HOME }}/.pyenv/bin:$PATH"
    eval "$(pyenv init -)"
    pyenv install --list | grep -E '^\s+3\.[0-9]+\.[0-9]+$' | tail -1 | tr -d ' '
  register: python_latest
  changed_when: false
  delegate_to: localhost
  tags: [python, updates]

- name: Set latest Python version variable
  set_fact:
    python_latest_version: "{{ python_latest.stdout }}"
  tags: [python, updates]

- name: Compare versions
  debug:
    msg: "python: current={{ python_version | default('none') }}, latest={{ python_latest_version }}"
  tags: [python, updates]
