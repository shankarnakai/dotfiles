---
- name: Get latest stylua version from GitHub
  uri:
    url: https://api.github.com/repos/JohnnyMorganz/StyLua/releases/latest
    return_content: true
  register: stylua_latest_release
  delegate_to: localhost
  tags: [stylua, updates]

- name: Set latest stylua version variable
  set_fact:
    stylua_latest_version: "{{ stylua_latest_release.json.tag_name | replace('v', '') }}"
  tags: [stylua, updates]

- name: Compare versions
  debug:
    msg: "stylua: current={{ stylua_version }}, latest={{ stylua_latest_version }}"
  tags: [stylua, updates]
