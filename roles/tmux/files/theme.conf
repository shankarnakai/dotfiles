# Catppuccin Macchiato for tmux -- hand-rolled.
#
# Sourced from tmux.conf *above* the tpm line, because tmux-cpu, tmux-battery
# and tmux-prefix-highlight rewrite status-left/status-right once when tpm
# sources them; placeholders set after that pass render empty. tmux-prefix-
# highlight also reads its @prefix_highlight_* options at that same moment.
#
# Colours are hex, not colourN: colour0/8/16 are terminal palette slots, and
# this terminal remaps them (16 is peach, not black) -- pairings that assumed
# otherwise are what made the previous theme unreadable at ~1.3:1.

# --------------------------------------------------------------------- roles --
# One variable per job, each holding a literal colour. Values are Catppuccin
# Macchiato, named in the trailing comment.
#
# Deliberately flat: tmux expands formats in a single pass when it draws, so a
# variable whose value is another #{@thm_*} reference never resolves -- the
# style silently ends up invalid and the segment draws uncoloured.
set -g @thm_bar_bg   '#363a4f'  # surface0 -- one step up from the terminal bg
set -g @thm_bar_fg   '#cad3f5'  # text     -- 7.5:1 on the bar
set -g @thm_badge_fg '#24273a'  # base     -- dark text, for use on light badges
set -g @thm_dim      '#a5adcb'  # subtext0 -- 5.0:1 on the bar; inactive windows
set -g @thm_sep      '#6e738d'  # overlay0 -- separators only, never text
set -g @thm_border   '#494d64'  # surface1
set -g @thm_accent   '#8aadf4'  # blue     -- active window, clock, active border
set -g @thm_session  '#a6da95'  # green    -- session badge
set -g @thm_mode     '#b7bdf8'  # lavender -- copy mode
set -g @thm_info     '#8bd5ca'  # teal     -- command prompt
set -g @thm_ok       '#a6da95'  # green    -- low load
set -g @thm_warn     '#eed49f'  # yellow   -- medium load, messages, bell
set -g @thm_crit     '#ed8796'  # red      -- high load
set -g @thm_alert    '#f5a97f'  # peach    -- background activity

set -g @thm_arrow_r      ''
set -g @thm_arrow_r_thin ''
set -g @thm_arrow_l      ''
set -g @thm_arrow_l_thin ''

# ------------------------------------------------------------------- the bar --
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style 'fg=#{@thm_bar_fg},bg=#{@thm_bar_bg}'

set -g status-left-length 32
set -g status-left '#[fg=#{@thm_badge_fg}]#[bg=#{@thm_session}]#[bold] ❐ #S #[fg=#{@thm_session}]#{?#{==:#{active_window_index},#{base-index}},#[bg=#{@thm_accent}],#[bg=#{@thm_bar_bg}]}#[nobold]'

# --------------------------------------------------------------- the windows --
# Inactive tabs stay flat on the bar and are divided by a thin chevron, the
# same divider the right-hand segments use -- on a shared background with no
# divider the names run together into one strip.
#
# The chevron is part of the format rather than window-status-separator, which
# tmux inserts between every pair of windows including on both sides of the
# active tab -- whose solid arrows already divide it, giving a doubled ">|>".
# Here it is suppressed for the last tab and for the tab preceding the active
# one, so exactly one divider falls between any two tabs.
#
# Colours are deliberately NOT inlined as #[fg=...] in the format: an inline
# directive outranks the *-style options, which would stop the activity, bell
# and last-window styles below from ever showing.
setw -g window-status-style 'fg=#{@thm_dim},bg=#{@thm_bar_bg}'
setw -g window-status-format ' #I #W#{?window_zoomed_flag, +,} #{?#{||:#{window_end_flag},#{==:#{e|+:#{window_index},1},#{active_window_index}}},,#[fg=#{@thm_sep}]}'

# Active window: base on blue, 6.6:1, arrow-wrapped so it reads as a raised tab
setw -g window-status-current-format '#{?#{==:#{window_index},#{base-index}},,#[fg=#{@thm_bar_bg}]#[bg=#{@thm_accent}]}#[fg=#{@thm_badge_fg}]#[bg=#{@thm_accent}]#[bold] #I #W#{?window_zoomed_flag, +,} #[fg=#{@thm_accent}]#[bg=#{@thm_bar_bg}]#[nobold]'

setw -g window-status-separator ''
setw -g window-status-last-style 'fg=#{@thm_accent},bg=#{@thm_bar_bg}'
setw -g window-status-bell-style 'fg=#{@thm_badge_fg},bg=#{@thm_warn},bold'
setw -g window-status-activity-style 'fg=#{@thm_alert},bg=#{@thm_bar_bg},none'

# ----------------------------------------------------------------- the right --
# CPU and RAM percentages are tinted by load via the plugins' own #{*_fg_color}
# formats; their labels stay at full contrast regardless.
set -g status-right-length 100
set -g status-right '#{prefix_highlight}#[fg=#{@thm_sep},bg=#{@thm_bar_bg}]#{@thm_arrow_l_thin} #[fg=#{@thm_bar_fg}]#{cpu_icon} #{cpu_fg_color}#{cpu_percentage}#[fg=#{@thm_sep}] #{@thm_arrow_l_thin} #[fg=#{@thm_bar_fg}]RAM #{ram_fg_color}#{ram_percentage}#[fg=#{@thm_sep}] #{@thm_arrow_l_thin} #[fg=#{@thm_bar_fg}]#{battery_icon} #{battery_percentage} #[fg=#{@thm_accent},bg=#{@thm_bar_bg}]#{@thm_arrow_l}#[fg=#{@thm_badge_fg},bg=#{@thm_accent},bold] %R #{@thm_arrow_l_thin} %a %d %b '

# ---------------------------------------------------------- panes & messages --
set -g pane-border-style 'fg=#{@thm_border}'
set -g pane-active-border-style 'fg=#{@thm_accent}'

# These three take a bare colour rather than a style, and tmux validates them
# on parse without expanding formats -- a #{@thm_*} here is a "bad colour"
# error, so they are the one place a value has to be repeated literally.
set -g display-panes-colour '#6e738d'
set -g display-panes-active-colour '#8aadf4'
setw -g clock-mode-colour '#8aadf4'

set -g message-style 'fg=#{@thm_badge_fg},bg=#{@thm_warn},bold'
set -g message-command-style 'fg=#{@thm_badge_fg},bg=#{@thm_info},bold'
setw -g mode-style 'fg=#{@thm_badge_fg},bg=#{@thm_mode},bold'

# ------------------------------------------------------------ plugin colours --
# tmux-cpu: option names are American-spelled (color, not colour) and each
# value must be a whole #[fg=...] directive -- a bare hex is silently ignored.
set -g @cpu_low_fg_color '#[fg=#{@thm_ok}]'
set -g @cpu_medium_fg_color '#[fg=#{@thm_warn}]'
set -g @cpu_high_fg_color '#[fg=#{@thm_crit}]'
set -g @ram_low_fg_color '#[fg=#{@thm_ok}]'
set -g @ram_medium_fg_color '#[fg=#{@thm_warn}]'
set -g @ram_high_fg_color '#[fg=#{@thm_crit}]'

# tmux-battery. Set explicitly so the glyphs are a decision recorded here
# rather than whichever defaults the plugin ships. Codepoints are from the
# 4-digit FontAwesome range, which Monoid Nerd Font covers.
set -g @batt_icon_status_charged ''
set -g @batt_icon_status_charging ''
set -g @batt_icon_status_attached ''
set -g @batt_icon_status_discharging ''
set -g @batt_icon_status_unknown ''
set -g @batt_icon_charge_tier8 ''
set -g @batt_icon_charge_tier7 ''
set -g @batt_icon_charge_tier6 ''
set -g @batt_icon_charge_tier5 ''
set -g @batt_icon_charge_tier4 ''
set -g @batt_icon_charge_tier3 ''
set -g @batt_icon_charge_tier2 ''
set -g @batt_icon_charge_tier1 ''

set -g @prefix_highlight_fg '#{@thm_badge_fg}'
set -g @prefix_highlight_bg '#{@thm_accent}'
set -g @prefix_highlight_prefix_prompt 'PREFIX'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#{@thm_badge_fg},bg=#{@thm_mode},bold'
set -g @prefix_highlight_copy_prompt 'COPY'
