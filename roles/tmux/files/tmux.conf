#remap prefix from Ctrl + b to  ctrl + a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# 0-based so the ten Alt-digit bindings below cover ten windows: with windows
# starting at 1, Alt-9 would reach the ninth and the tenth had no chord at all.
# Panes stay 1-based -- they are picked from the display-panes overlay, which
# reads better counting from one.
set -g base-index 0
setw -g pane-base-index 1

# Closing a middle window would otherwise leave a hole in the numbering, which
# breaks the Alt-<n> jumps below.
set -g renumber-windows on

# Keep names set with `,` -- without this, programs rewrite the window title
set -g allow-rename off

set -g status-keys vi
setw -g mode-keys vi

set -g extended-keys on
set -g extended-keys-format csi-u

# No delay for escape key press
set -sg escape-time 0

# History setting
set -g history-limit 100000

# focus events enabled for terminals that support them
set -g focus-events on

# tmux's compiled-in default for this differs between builds and packagers, so
# panes can land on plain `screen` and lose 256-colour support. Pinning it keeps
# the inner TERM independent of how tmux was built.
set -g default-terminal "tmux-256color"

# TERM is pinned to xterm-256color (see the alacritty role), whose terminfo
# advertises neither 24-bit colour nor OSC 8. Declaring the features is what
# makes tmux emit the hex colours further down as truecolour instead of
# quantising them to the 256-colour cube.
set -as terminal-features ',*:RGB:hyperlinks'

bind R source-file ~/.tmux.conf \; display "Reloaded!"

# Toggle mouse on with ^A m
bind m \
  set-option -g mouse on \;\
  display 'Mouse: ON'

# Toggle mouse off with ^A M
bind M \
  set-option -g mouse off \;\
  display 'Mouse: OFF'

############################## KEY BINDINGS ##################################

# New panes and windows open in the current pane's directory
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# `s` is the split above, so the session picker it would otherwise shadow moves
# to `S`.
bind-key S choose-tree -Zs

# h/j/k/l (select-pane), H/J/K/L (resize by 5) and the | - % " splits all come
# from tmux-pain-control, which is why they are absent here. These Alt variants
# resize a column at a time, which pain-control does not cover.
bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D 
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Shift-arrow, not Shift-letter: a terminal has no distinct encoding for
# shift+letter, so binding S-P/S-N would only ever match plain P and N.
bind -n S-Left previous-window
bind -n S-Right next-window

# Alt-r: Rename window
bind -n M-r command-prompt -I "#W" "rename-window '%%'"

# Alt-Shift-r: Rename session
bind -n M-R command-prompt -I "#S" "rename-session '%%'"

# Alt-[0-9]: Switch to window
bind -n M-0 select-window -t :0
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Alt-q: Choose last session
bind -n M-q switch-client -l \; refresh-client -S

# Alt-w: Close pane
bind -n M-w kill-pane

# Alt-c: Copy mode
bind -n M-c copy-mode

# Alt-f: Copy mode and search up
bind -n M-f copy-mode \; send-keys ?


# Ctrl-Shift-Left/Right: Move window
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# Copy mode behaves more like vim
#bind -t vi-copy v begin-selection
#bind -t vi-copy V rectangle-toggle

# After a -r binding fires, the prefix stays live this long so the key repeats
# bare: `prefix H H H` resizes three times. Applies to the resize keys
# (H/J/K/L, C-arrows, M-arrows), select-pane arrows and swap-window < >.
# The trade-off is that H/J/K/L are ordinary characters, so typing one within
# the window after a resize is swallowed as another resize.
set-option -g repeat-time 500

# Appearance lives in its own file (symlinked to ~/.tmux/theme.conf by the tmux
# role). It must be sourced before tpm: tmux-cpu, tmux-battery and
# tmux-prefix-highlight rewrite status-left/status-right once, as tpm sources
# them, and placeholders set after that pass render empty.
source-file ~/.tmux/theme.conf

# LIST OF PLUGINS
set -g @tpm_plugins '                     \
    tmux-plugins/tpm                      \
    tmux-plugins/tmux-sensible            \
    tmux-plugins/tmux-resurrect           \
    tmux-plugins/tmux-continuum           \
    tmux-plugins/tmux-yank                \
    tmux-plugins/tmux-pain-control        \
    tmux-plugins/tmux-copycat             \
    tmux-plugins/tmux-open                \
    tmux-plugins/tmux-battery             \
    tmux-plugins/tmux-cpu                 \
    tmux-plugins/tmux-prefix-highlight    \
'

# tmux-continuum only writes snapshots on its own; this is what makes it read
# the last one back when the server starts.
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
