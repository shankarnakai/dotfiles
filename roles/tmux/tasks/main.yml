---
- name: Install tmux
  package:
    name: tmux
    state: present
  become: "{{ ansible_os_family != 'Darwin' }}"

- name: Install tpm
  git:
    repo: https://github.com/tmux-plugins/tpm
    dest: "{{ dotfiles_user_home }}/.tmux/plugins/tpm"

- name: Symlink .tmux.conf
  file:
    src: "{{ dotfiles_home }}/roles/tmux/files/tmux.conf"
    dest: "{{ dotfiles_user_home }}/.tmux.conf"
    state: link
    force: yes

- name: Install tmux plugins via TPM
  command: "{{ dotfiles_user_home }}/.tmux/plugins/tpm/bin/install_plugins"
  changed_when: false
