---
- name: Verify Alacritty installation (Linux)
  command: alacritty --version
  register: alacritty_version
  changed_when: false
  failed_when: alacritty_version.rc != 0
  when: ansible_os_family == 'Debian'

- name: Verify Alacritty installation (macOS)
  stat:
    path: "/Applications/Alacritty.app"
  register: alacritty_mac_stat
  failed_when: not alacritty_mac_stat.stat.exists
  when: ansible_os_family == 'Darwin'

- name: Verify Alacritty config exists
  stat:
    path: "~/.config/alacritty/alacritty.toml"
  register: alacritty_config_stat
  failed_when: not alacritty_config_stat.stat.exists
