---
- name: Verify Claude Code installation (Linux)
  command: claude --version
  register: claude_linux_version
  changed_when: false
  failed_when: claude_linux_version.rc != 0
  when: ansible_os_family == 'Debian'

- name: Verify Claude Code installation (macOS)
  command: claude --version
  register: claude_mac_version
  changed_when: false
  failed_when: claude_mac_version.rc != 0
  when: ansible_os_family == 'Darwin'

- name: Verify Claude Desktop installation (macOS)
  stat:
    path: "/Applications/Claude.app"
  register: claude_desktop_stat
  failed_when: not claude_desktop_stat.stat.exists
  when: ansible_os_family == 'Darwin' and lookup('env', 'CI') == ""
